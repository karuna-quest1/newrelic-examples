# ClickStack backend — ClickHouse + MongoDB + HyperDX as standalone containers.
#
# This is the "observability backend runs as Docker containers" half of the
# docker-support test topology:
#
#   spring-petclinic (Kubernetes)  --OTLP-->  otel-collector (Docker, generated
#       by shinro `migrate --live --target docker`)  -->  clickhouse (here)
#                                                          ^ HyperDX reads here
#
# It deliberately does NOT include the OTel Collector — that is generated by the
# shinro OTel config generator (`--target docker`) and attaches to the network
# below (`clickstack`) as an EXTERNAL network.
#
# Bring it up FIRST (before running the migration):
#   cd clickstack-backend
#   docker compose up -d
#   docker compose ps
#
# Names/ports/creds here are chosen so the live-migrate defaults line up:
#   network = clickstack | clickhouse container = clickhouse | db = otel
#   native port = 9000    | user = default        | password = password
services:
  # ── ClickHouse — columnar store for all OTel signals ───────────────────────
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse
    restart: unless-stopped
    ports:
      - "8123:8123"   # HTTP interface (ClickHouse Play UI / debugging)
      - "9000:9000"   # Native TCP — the OTel Collector writes here
    environment:
      CLICKHOUSE_DB: otel
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: password
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - clickstack

  # ── MongoDB — HyperDX application state (dashboards, alerts, users) ─────────
  mongodb:
    image: mongo:6
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - clickstack

  # ── HyperDX — UI that reads traces/metrics/logs from ClickHouse ────────────
  #   UI:  http://localhost:8082   (create an account on first visit)
  #   API: http://localhost:8000
  # UI is on 8082 (not 8080) so it doesn't clash with Spring PetClinic locally.
  hyperdx:
    image: hyperdx/hyperdx:latest
    container_name: hyperdx
    restart: unless-stopped
    ports:
      - "8082:8080"   # HyperDX UI
      - "8000:8000"   # HyperDX API
    environment:
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=password
      - CLICKHOUSE_DB=otel
      - MONGO_URI=mongodb://mongodb:27017/hyperdx
      - NODE_ENV=production
    depends_on:
      clickhouse:
        condition: service_healthy
      mongodb:
        condition: service_started
    networks:
      - clickstack

volumes:
  clickhouse_data:
  mongo_data:

networks:
  # Explicit `name:` pins the real Docker network name to exactly "clickstack"
  # (otherwise Compose prefixes it with the project/directory name). The
  # generated collector compose references this network as `external: true`,
  # so it MUST already exist with this exact name before the collector starts.
  clickstack:
    name: clickstack
    driver: bridge
