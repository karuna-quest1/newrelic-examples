name: Deploy and Test Cluster

on:
  push:
    branches: [main]
    paths:
      - 'k8s/**'
  pull_request:
    branches: [main]
    paths:
      - 'k8s/**'

jobs:
  deploy-and-test-cluster:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v2

      - name: Create k8s Kind Cluster
        uses: helm/kind-action@v1

      - name: Deploy application
        run: |
          # Apply namespaces first so subsequent resources have a target namespace.
          kubectl apply -f k8s/monitoring-namespace.yml
          kubectl apply -f k8s/namespace.yml
          # Deploy monitoring stack (ClickHouse, OTel Collector) then the app.
          kubectl apply -f k8s/clickhouse.yml
          kubectl apply -f k8s/otel-collector.yml
          kubectl apply -f k8s/db.yml
          kubectl apply -f k8s/petclinic.yml

      - name: Wait for Pods to be ready
        run: |
          kubectl wait --for=condition=ready pod -l app=clickhouse   -n monitoring --timeout=180s
          kubectl wait --for=condition=ready pod -l app=otel-collector -n monitoring --timeout=120s
          kubectl wait --for=condition=ready pod -l app=demo-db       -n petclinic  --timeout=180s
          kubectl wait --for=condition=ready pod -l app=petclinic     -n petclinic  --timeout=180s

