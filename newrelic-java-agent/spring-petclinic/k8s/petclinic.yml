---
apiVersion: v1
kind: Service
metadata:
  name: petclinic
  namespace: petclinic
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080
  selector:
    app: petclinic

---
apiVersion: v1
kind: Secret
metadata:
  name: newrelic-license
  namespace: petclinic
type: Opaque
stringData:
  license-key: "${NEW_RELIC_LICENSE_KEY}"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: petclinic
  namespace: petclinic
  labels:
    app: petclinic
    app.kubernetes.io/name: petclinic
    app.kubernetes.io/version: "3.5.0"
    app.kubernetes.io/part-of: spring-petclinic
spec:
  replicas: 1
  selector:
    matchLabels:
      app: petclinic
  template:
    metadata:
      labels:
        app: petclinic
        app.kubernetes.io/name: petclinic
    spec:
      initContainers:
        - name: newrelic-agent-init
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              wget -q -O /newrelic/newrelic.jar \
                https://repo1.maven.org/maven2/com/newrelic/agent/java/newrelic-agent/8.15.0/newrelic-agent-8.15.0.jar || \
              curl -sL -o /newrelic/newrelic.jar \
                https://repo1.maven.org/maven2/com/newrelic/agent/java/newrelic-agent/8.15.0/newrelic-agent-8.15.0.jar
          volumeMounts:
            - name: newrelic-agent
              mountPath: /newrelic
      containers:
        - name: workload
          image: petclinic:local
          imagePullPolicy: IfNotPresent
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: postgres
            - name: SERVICE_BINDING_ROOT
              value: /bindings
            - name: SPRING_APPLICATION_JSON
              value: |
                {
                  "management.endpoint.health.probes.add-additional-paths": true
                }
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://demo-db:5432/petclinic"
            - name: SPRING_DATASOURCE_USERNAME
              value: "user"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "pass"
            - name: NEW_RELIC_LICENSE_KEY
              valueFrom:
                secretKeyRef:
                  name: newrelic-license
                  key: license-key
            # Only the New Relic Java agent runs — data goes directly to New Relic.
            # No OTel collector is deployed. To add ClickHouse dual-write, run the
            # Shinro otel-config-creator with --kubernetes to generate the OTel
            # collector manifest and an updated petclinic patch that adds the
            # OTel agent alongside the NR agent.
            - name: JAVA_TOOL_OPTIONS
              value: "-javaagent:/newrelic/newrelic.jar"
            - name: NEW_RELIC_APP_NAME
              value: "petclinic-k8s"
            - name: NEW_RELIC_DISTRIBUTED_TRACING_ENABLED
              value: "true"
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - mountPath: /bindings/secret
              name: binding
              readOnly: true
            - name: newrelic-agent
              mountPath: /newrelic
      volumes:
        - name: binding
          projected:
            sources:
              - secret:
                  name: demo-db
        - name: newrelic-agent
          emptyDir: {}
