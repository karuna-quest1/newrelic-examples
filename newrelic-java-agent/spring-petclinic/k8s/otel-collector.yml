---
# OTel Collector — DaemonSet (one pod per node).
#
# Runs on every node so kubeletstats and hostmetrics receivers can scrape
# local kubelet and OS metrics. The OTLP receiver is exposed via a Service
# so app pods can still reach it at:
#   http://otel-collector.monitoring.svc.cluster.local:4318
#
# Pipelines:
#   1. APM (traces/metrics/logs)  — otlp receiver        → ClickHouse + New Relic OTLP
#   2. K8s cluster metrics        — k8s_cluster receiver → ClickHouse + New Relic OTLP
#   3. Pod/container metrics      — kubeletstats receiver → ClickHouse + New Relic OTLP
#   4. Node infra metrics         — hostmetrics receiver  → ClickHouse + New Relic OTLP

apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: monitoring
data:
  otel-collector-config.yaml: |
    receivers:
      # ── APM receiver ─────────────────────────────────────────────────────────
      # Receives traces, metrics, and logs pushed by the OTel Java agent.
      otlp:
        protocols:
          grpc:
            endpoint: "0.0.0.0:4317"
          http:
            endpoint: "0.0.0.0:4318"

      # ── Kubernetes cluster metrics ────────────────────────────────────────────
      # Scrapes the Kubernetes API server for cluster-level metrics:
      #   k8s.pod.phase, k8s.deployment.available, k8s.node.condition,
      #   k8s.replicaset.available, k8s.namespace.phase, etc.
      # Runs once per cluster — only the elected leader DaemonSet pod scrapes
      # to avoid duplicate data (controlled by the k8s_leader_election extension).
      k8s_cluster:
        auth_type: serviceAccount
        collection_interval: 30s
        node_conditions_to_report:
          - Ready
          - MemoryPressure
          - DiskPressure
        allocatable_types_to_report:
          - cpu
          - memory

      # ── Pod / container metrics ───────────────────────────────────────────────
      # Scrapes the local node's kubelet /stats/summary endpoint.
      # Produces per-pod and per-container CPU, memory, filesystem, and network
      # metrics: k8s.pod.cpu.utilization, k8s.container.memory.usage, etc.
      # Each DaemonSet pod scrapes only its own node (MY_NODE_NAME env var).
      kubeletstats:
        collection_interval: 20s
        auth_type: serviceAccount
        endpoint: "https://${env:MY_NODE_NAME}:10250"
        insecure_skip_verify: true
        metric_groups:
          - node
          - pod
          - container

      # ── Node infrastructure metrics ───────────────────────────────────────────
      # Scrapes OS-level metrics from the node: CPU, memory, disk I/O, filesystem,
      # network, load average, paging. Uses hostfs mounted from the node.
      # Produces: system.cpu.utilization, system.memory.usage,
      #           system.disk.io, system.network.io, system.filesystem.usage, etc.
      hostmetrics:
        collection_interval: 30s
        root_path: /hostfs
        scrapers:
          cpu:
            metrics:
              system.cpu.utilization:
                enabled: true
          memory:
            metrics:
              system.memory.utilization:
                enabled: true
          disk: {}
          filesystem:
            exclude_mount_points:
              mount_points: ["/dev/*", "/proc/*", "/sys/*", "/run/k3s/containerd/*", "/var/lib/docker/*", "/var/lib/kubelet/*", "/snap/*"]
              match_type: regexp
          network: {}
          load: {}
          paging: {}
          processes: {}

    processors:
      # ── k8s metadata enrichment ───────────────────────────────────────────────
      # Adds pod name, namespace, deployment, node to APM signals (otlp pipeline).
      k8sattributes:
        auth_type: serviceAccount
        passthrough: false
        extract:
          metadata:
            - k8s.pod.name
            - k8s.pod.uid
            - k8s.deployment.name
            - k8s.namespace.name
            - k8s.node.name
          labels:
            - tag_name: app.kubernetes.io/name
              key: app.kubernetes.io/name
              from: pod
        pod_association:
          - sources:
              - from: resource_attribute
                name: k8s.pod.ip
          - sources:
              - from: connection

      # ── Resource attribute — add cluster name to all signals ──────────────────
      resource:
        attributes:
          - key: k8s.cluster.name
            value: "petclinic-kind"
            action: insert
          - key: deployment.environment
            value: "production"
            action: insert

      # ── Batch for efficiency ──────────────────────────────────────────────────
      batch:
        timeout: 5s
        send_batch_size: 1000

      # ── Drop APM signals with no service.name ─────────────────────────────────
      filter/drop_empty_service:
        error_mode: ignore
        traces:
          span:
            - resource.attributes["service.name"] == nil
        metrics:
          metric:
            - resource.attributes["service.name"] == nil
        logs:
          log_record:
            - resource.attributes["service.name"] == nil

    exporters:
      # ── ClickHouse exporter ───────────────────────────────────────────────────
      # Writes all signals to in-cluster ClickHouse. Auto-creates OTel schema
      # tables on first run (otel_traces, otel_metrics_gauge, otel_logs, etc.)
      clickhouse:
        endpoint: "tcp://clickhouse.monitoring.svc.cluster.local:9000"
        database: otel
        username: default
        password: password
        ttl: 72h
        create_schema: true
        timeout: 10s
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s
        sending_queue:
          enabled: true
          num_consumers: 2
          queue_size: 100

      # ── Debug exporter ────────────────────────────────────────────────────────
      debug:
        verbosity: basic

    extensions:
      health_check:
        endpoint: "0.0.0.0:13133"

    service:
      extensions: [health_check]
      pipelines:
        # APM: traces from the OTel Java agent → ClickHouse only.
        # NR Java agent handles sending APM data to New Relic directly.
        traces:
          receivers: [otlp]
          processors: [k8sattributes, resource, filter/drop_empty_service, batch]
          exporters: [clickhouse, debug]

        # APM: JVM + app metrics from the OTel Java agent → ClickHouse only.
        metrics/apm:
          receivers: [otlp]
          processors: [k8sattributes, resource, filter/drop_empty_service, batch]
          exporters: [clickhouse, debug]

        # K8s cluster-level metrics → ClickHouse only.
        # New Relic receives these via nrk8s-ksm (kube-state-metrics) in the
        # newrelic namespace — no duplication needed here.
        metrics/k8s_cluster:
          receivers: [k8s_cluster]
          processors: [resource, batch]
          exporters: [clickhouse]

        # Pod + container metrics from kubelet → ClickHouse only.
        # New Relic receives these via nrk8s-kubelet DaemonSet.
        metrics/kubeletstats:
          receivers: [kubeletstats]
          processors: [resource, batch]
          exporters: [clickhouse]

        # Node OS / infrastructure metrics → ClickHouse only.
        # New Relic receives these via nrk8s-kubelet DaemonSet.
        metrics/hostmetrics:
          receivers: [hostmetrics]
          processors: [resource, batch]
          exporters: [clickhouse]

        # Logs from the OTel Java agent → ClickHouse only.
        logs:
          receivers: [otlp]
          processors: [k8sattributes, resource, filter/drop_empty_service, batch]
          exporters: [clickhouse, debug]

---
# ServiceAccount for the collector pods.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector
  namespace: monitoring

---
# ClusterRole — permissions needed by:
#   k8sattributes processor : pods, namespaces, replicasets
#   k8s_cluster receiver    : nodes, pods, namespaces, replicationcontrollers,
#                             resourcequotas, services, statefulsets, deployments,
#                             daemonsets, replicasets, jobs, cronjobs, horizontalpodautoscalers
#   kubeletstats receiver   : nodes/stats, nodes/proxy
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: otel-collector
rules:
  - apiGroups: [""]
    resources:
      - pods
      - namespaces
      - nodes
      - nodes/stats
      - nodes/proxy
      - replicationcontrollers
      - resourcequotas
      - services
      - endpoints
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - replicasets
      - deployments
      - daemonsets
      - statefulsets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources:
      - horizontalpodautoscalers
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: otel-collector
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: otel-collector
subjects:
  - kind: ServiceAccount
    name: otel-collector
    namespace: monitoring

---
# Service — exposes OTLP ports so app pods can reach the collector.
# Traffic is load-balanced across all DaemonSet pods (one per node).
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: monitoring
spec:
  selector:
    app: otel-collector
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
    - name: health-check
      port: 13133
      targetPort: 13133

---
# DaemonSet — one collector pod per node.
# Required so kubeletstats and hostmetrics scrape the local node directly.
# The OTLP receiver still works — the Service above load-balances across all pods.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: otel-collector
  namespace: monitoring
  labels:
    app: otel-collector
spec:
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      serviceAccountName: otel-collector
      # hostNetwork gives the collector access to node network interfaces
      # needed by the hostmetrics network scraper.
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.102.0
          args: ["--config=/etc/otel/otel-collector-config.yaml"]
          env:
            # Downward API — passes the node name so kubeletstats knows which
            # kubelet endpoint to scrape.
            - name: MY_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName

          ports:
            - name: otlp-grpc
              containerPort: 4317
              hostPort: 4317
            - name: otlp-http
              containerPort: 4318
              hostPort: 4318
            - name: health-check
              containerPort: 13133
              hostPort: 13133
          volumeMounts:
            - name: config
              mountPath: /etc/otel
            # hostfs mount — gives the hostmetrics receiver access to the node's
            # /proc, /sys, /etc so it can read OS-level metrics.
            - name: hostfs
              mountPath: /hostfs
              readOnly: true
              mountPropagation: HostToContainer
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: health-check
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: health-check
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
        # Node's root filesystem mounted at /hostfs inside the container.
        - name: hostfs
          hostPath:
            path: /
