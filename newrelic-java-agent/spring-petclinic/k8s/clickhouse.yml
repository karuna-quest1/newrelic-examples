---
# ClickHouse — columnar storage for all OTel signals (traces, metrics, logs).
# The otel-collector writes here; HyperDX reads from here to power its UI.
#
# HTTP interface: port 8123  (ClickHouse Play UI / ad-hoc queries)
# Native TCP:     port 9000  (used by otel-collector exporter)
#
# Credentials match the docker-compose setup so configs stay consistent.

apiVersion: v1
kind: Secret
metadata:
  name: clickhouse-credentials
  namespace: monitoring
type: Opaque
stringData:
  username: "${CLICKHOUSE_USERNAME}"
  password: "${CLICKHOUSE_PASSWORD}"
  database: "${CLICKHOUSE_DATABASE}"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-config
  namespace: monitoring
data:
  # Allow connections from any pod in the cluster.
  listen_host.xml: |
    <clickhouse>
      <listen_host>0.0.0.0</listen_host>
    </clickhouse>

---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  namespace: monitoring
spec:
  selector:
    app: clickhouse
  ports:
    - name: http
      port: 8123
      targetPort: 8123
    - name: native
      port: 9000
      targetPort: 9000

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: clickhouse
  namespace: monitoring
  labels:
    app: clickhouse
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: clickhouse
  template:
    metadata:
      labels:
        app: clickhouse
    spec:
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:25.1
          env:
            - name: CLICKHOUSE_DB
              valueFrom:
                secretKeyRef:
                  name: clickhouse-credentials
                  key: database
            - name: CLICKHOUSE_USER
              valueFrom:
                secretKeyRef:
                  name: clickhouse-credentials
                  key: username
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: clickhouse-credentials
                  key: password
          ports:
            - name: http
              containerPort: 8123
            - name: native
              containerPort: 9000
          volumeMounts:
            - name: clickhouse-data
              mountPath: /var/lib/clickhouse
            - name: clickhouse-config
              mountPath: /etc/clickhouse-server/config.d/listen_host.xml
              subPath: listen_host.xml
          resources:
            requests:
              memory: "2Gi"
              cpu: "250m"
            limits:
              memory: "8Gi"
              cpu: "500m"
          # startupProbe gates liveness/readiness until ClickHouse finishes
          # startup + part recovery (can be slow after an unclean OOM shutdown).
          # Up to failureThreshold*periodSeconds = 30*10s = 5m grace before liveness engages.
          startupProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: clickhouse-data
          persistentVolumeClaim:
            claimName: clickhouse-data
        - name: clickhouse-config
          configMap:
            name: clickhouse-config

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: clickhouse-data
  namespace: monitoring
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
